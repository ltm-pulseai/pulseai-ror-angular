<header class="navbar">
  <div class="container">
    <a id="logo" routerLink="/">sample app</a>
    <nav>
      <ul class="nav-links">
        <li><a routerLink="/">Home</a></li>
        <li><a routerLink="/help">Help</a></li>
        @if (auth.currentUser(); as user) {
          <li><a routerLink="/users">Users</a></li>
          <li class="dropdown">
            <span>Account</span>
            <ul class="dropdown-menu">
              <li><a [routerLink]="['/users', user.id]">Profile</a></li>
              <li><a [routerLink]="['/users', user.id, 'edit']">Settings</a></li>
              <li><button type="button" (click)="logout()">Log out</button></li>
            </ul>
          </li>
        } @else {
          <li><a routerLink="/login">Log in</a></li>
        }
      </ul>
    </nav>
  </div>
</header>
