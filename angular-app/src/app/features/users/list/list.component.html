<h1>All users</h1>

@if (data(); as data) {
  <ul class="users">
    @for (user of data.users; track user.id) {
      <li>
        <img [src]="user.gravatarUrl" [alt]="user.name" class="gravatar" width="30" height="30" />
        <a [routerLink]="['/users', user.id]">{{ user.name }}</a>
      </li>
    }
  </ul>
  <!--
    Pagination controls and admin delete-link deliberately omitted —
    destroy/pagination were scoped out of this Phase 2 delivery, see
    reports/parity/users-sessions.md.
  -->
}
