<h1>Reset password</h1>

<div class="row">
  <div class="col-md-6 col-md-offset-3">
    @if (checking()) {
      <p>Checking link...</p>
    } @else if (linkError()) {
      <div class="alert alert-danger">{{ linkError() }}</div>
    } @else {
      <app-form-errors [errors]="serverErrors()" />

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" class="form-control" />

        <label for="password_confirmation">Confirmation</label>
        <input id="password_confirmation" type="password" formControlName="password_confirmation" class="form-control" />

        <button type="submit" class="btn btn-primary" [disabled]="submitting()">Update password</button>
      </form>
    }
  </div>
</div>
